[project]
name = "otobacktest"
version = "0.1.0"
description = "NAS100/SPX500/Gold/Silver intraday Volume Profile + ICT backtest tools"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas==3.0.3",
    "numpy>=1.26.0",
    "MetaTrader5==5.0.6090; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]

[project.scripts]
otobt = "backtest.cli:main"

[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backtest*"]
